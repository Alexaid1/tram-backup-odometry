# tram_odometry: all configurable parameters (see docs/assumptions.md for descriptions).
# Values marked [calib] were fitted on the dataset (tools/calibrate.py, tools/calib_arclen.py).
tram_odometry_node:
  ros__parameters:
    topics:
      front: /vehicle/front_bogie_velocity
      rear: /vehicle/rear_bogie_velocity
      command: /vehicle/driver_position_cmd
      gnss_master_fix: /sensing/gnss/master/fix
      gnss_rover_fix: /sensing/gnss/rover/fix
      velocity_out: /result/velocity
      position_out: /result/position
      status_out: /result/slip_status
    frames:
      map: map
      base_link: base_link
      relative: odom
    publish:
      min_period: 0.02          # s of data time between outputs (<= 50 Hz, event driven)
      # [calib] the jury reference /localization/kinematic_state lags bogie stamps by ~0.08-0.10 s:
      # the output stamped T carries the state at T - time_offset. Set 0.0 for a GNSS truth
      # without lag (dataset GNSS velocity has no offset). See docs/validation.md.
      time_offset: 0.08
      timer_period: 0.025       # s wall time: fixed-rate publication between inputs (40 Hz)
      timer_max_extrapolation: 0.1      # s: model extrapolation between inputs (copy of the filter)
      watchdog_max_extrapolation: 2.0   # s: keep extrapolating during a total input dropout
      diagnostics_period: 0.2   # s
    map:
      # closed route = pathgraph + terminal loops reconstructed offline (maps/route_closed.json);
      # set use_closed_route:=false to run on the original pathgraph files only.
      use_closed_route: true
      lateral_sigma: 0.3
    landmarks:
      # repeatable stop locations (maps/stations.json, built offline); used only at confirmed
      # standstill, only with the closed route
      enabled: true
      standstill_time: 3.0      # s
      min_travel: 30.0          # m since previous snap
      gate: 8.0                 # m, max |innovation|; no snap if 2 landmarks inside the gate
      stop_sigma: 1.0           # m, stop-position variability
    model:
      A_t: 1.5013               # [calib] max specific traction force, m/s^2
      gamma_t: 0.8239           # [calib] notch -> force shape
      v_base: 5.447             # [calib] m/s, constant-force / constant-power corner
      p_shape: 2.887            # [calib]
      A_b: 1.2072               # [calib] max specific brake force, m/s^2
      gamma_b: 0.5839           # [calib]
      v_eps_brake: 0.3
      c0: 0.0534                # [calib] specific running resistance, m/s^2
      c1: -0.00584              # [calib] 1/s
      c2: 0.000284              # [calib] 1/m
      tau_drive: 0.3            # [calib] s, drive response lag
      notch_max: 15.0
      deadzone: 0.5
      mass_kg: 50000.0          # nominal (diagnostic force/torque only)
      wheel_radius_m: 0.355
      gear_ratio: 7.0
      n_motors: 4
      adapt: true               # online RLS adaptation of drive gain (effective mass)
      rls_lambda: 0.9995
      kappa_min: 0.6
      kappa_max: 1.6
      rls_min_regressor: 0.15
    input:
      wheel_unit_scale: 0.2777777777777778   # bogie speed is recorded in km/h
      wheel_scale_front: 1.0
      wheel_scale_rear: 1.0
      max_wheel_speed: 30.0
      arc_scale: 1.00043        # [calib] map arc length / odometry distance
      max_msg_lag: 0.5
      reset_on_backstep: 2.0
      stale_timeout: 0.6
    ekf:
      sigma_wheel_abs: 0.03
      sigma_wheel_rel: 0.005
      q_v: 0.04
      q_v_no_cmd: 0.30
      q_s: 0.0001
      q_d: 0.01
      tau_d: 30.0
      q_b: 1.0e-09
      q_mu: 1.0e-05
      mu_nominal: 0.20
      tau_mu: 300.0
      k_adhesion: 1.0
      use_adhesion_limit: true
      p0_v: 1.0
      p0_s: 0.01
      p0_d: 0.05
      p0_b: 1.0e-05
      p0_mu: 0.01
      max_predict_step: 0.05
      p0_c: 2.5e-05            # prior variance of common wheel-scale error (0.5 %)^2
      q_c: 1.0e-10
    slip:
      p_grip_stay: 0.98
      p_grip_to_slip: 0.015
      p_slip_stay: 0.88
      p_slip_to_grip: 0.10
      p_fault_stay: 0.97
      p_fault_to_grip: 0.02
      sigma_slip: 1.5
      fault_density: 0.0333
      p_fault_skip: 0.5
      p_slip_skip: 0.9
      nis_hard_gate: 100.0
      wheel_accel_max: 2.5
      front_rear_abs: 0.3
      front_rear_rel: 0.05
      directional_thr: 0.3
      stuck_speed: 0.5
      var_window: 20
      var_thr: 0.05
    init:
      mode: gnss                # gnss | fixed_xy | fixed_s | relative
      # x / y / yaw: set for fixed_xy (also used as fallback if no GNSS within timeout)
      path: 0
      s: 0.0
      window: 5.0
      min_fixes: 3
      timeout: 15.0
      max_lateral: 200.0
      sigma_s: 5.0              # m, along-track std after GNSS alignment
    gnss:
      master_x: -9.873          # tf antennas in base_link
      master_y: 0.0
      master_z: 3.0
      rover_x: 2.563
      rover_y: 0.0
      rover_z: 3.0
      correction: false         # true: use later GNSS fixes as along-track measurements
      sigma_along: 1.5
      gate: 16.0
      utm_zone: 37              # map = UTM37N - (300000, 6100000) (identified offline)
      north: true
      map_offset_x: 300000.0
      map_offset_y: 6100000.0
      map_offset_z: -0.14
